name: Daily Spin stories

on:
  schedule:
    # GitHub cron is in UTC. 06:00 UTC = 10 PM Pacific standard time (11 PM during daylight time).
    - cron: "0 6 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
    inputs:
      date:
        description: "Date to build (YYYY-MM-DD). Leave blank for tomorrow."
        required: false

permissions:
  contents: write           # needed to commit data/stories.json back to the repo

concurrency:                # never run two at once
  group: daily-spin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find tomorrow's stories with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/make_stories.py ${{ github.event.inputs.date }}

      - name: Commit the new stories
        run: |
          git config user.name "daily-spin-bot"
          git config user.email "daily-spin-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Daily Spin stories $(date -u +%F)"
          # The repo may have changed while Claude was searching: pull first, then push (3 tries).
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
