name: Daily Spin stories

on:
  schedule:
    # GitHub cron is in UTC. 06:00 UTC = 10 PM Pacific standard time (11 PM during daylight time).
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to build (YYYY-MM-DD). Leave blank for tomorrow."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find tomorrow's stories with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/make_stories.py ${{ github.event.inputs.date }}

      - name: Commit the new stories
        run: |
          git config user.name "daily-spin-bot"
          git config user.email "daily-spin-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily Spin stories $(date -u +%F)"
          git push
